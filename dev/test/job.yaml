apiVersion: batch/v1
kind: Job
metadata:
  name: tools
spec:
  template:
    metadata:
      name: tools
    spec:
      containers:
      - name: tools
        args:
        - /bin/sh
        - -c
        - |
          date
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: ghcr.io/liangyuanpeng/ubuntu:tools-v1
        imagePullPolicy: IfNotPresent
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000